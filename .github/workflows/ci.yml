name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede an in-flight run when a newer commit arrives on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      - name: Build with warnings as errors
        # Keep Xcode 16.4's Swift 6.1.2 frontend in single-primary mode. This
        # preserves every diagnostic and prevents multi-primary compilation
        # from amplifying frontend regressions in the SwiftUI target.
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -disable-batch-mode

      # Keyed on the bootstrap script because it carries the pinned qpdf and
      # libjpeg-turbo revisions: changing a pin changes the key and rebuilds.
      # No restore-keys on purpose, since a partial hit would restore sources
      # at the wrong revision and the bootstrap script refuses those.
      - name: Cache pinned PDF dependencies
        uses: actions/cache@v5
        with:
          path: .build/vendor
          key: pdf-vendor-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bootstrap-pdf-tools.sh') }}

      - name: Build pinned PDF dependencies
        run: ./bootstrap-pdf-tools.sh

      - name: Build local PDF cleaning helper
        run: ./build-local.sh

      - name: Run unit and integration tests
        run: swift test -Xswiftc -disable-batch-mode

      - name: Run packaging and restriction quality gate
        run: ./quality-gate.sh
