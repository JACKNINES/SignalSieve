name: Bug report
description: Report reproducible behavior using synthetic, non-sensitive input.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private clipboard contents, tokens, complete tracked URLs,
        personal rules, or sensitive documents. Create the smallest synthetic
        example that reproduces the problem.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide safe sample input and exact steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Signal Sieve version
      placeholder: 0.12.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS and Mac model
      placeholder: macOS 15.x, Apple M2
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private and identifying data from this report.
          required: true
