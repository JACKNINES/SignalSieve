name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Show Swift toolchain
        run: swift --version

      - name: Build with warnings as errors
        # Xcode 16.4's Swift 6.1.2 frontend can abort in IRGen when SwiftPM
        # batches several SwiftUI primary files into one frontend invocation.
        # Single-file mode preserves every diagnostic while avoiding that
        # compiler path.
        run: swift build -Xswiftc -warnings-as-errors -Xswiftc -disable-batch-mode

      - name: Build pinned PDF dependencies
        run: ./bootstrap-pdf-tools.sh

      - name: Build local PDF cleaning helper
        run: ./build-local.sh

      - name: Run unit and integration tests
        run: swift test -Xswiftc -disable-batch-mode

      - name: Run packaging and restriction quality gate
        run: ./quality-gate.sh
