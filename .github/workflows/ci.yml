name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: swift --version

      - name: Build with warnings as errors
        run: swift build -Xswiftc -warnings-as-errors

      - name: Run unit and integration tests
        run: swift test

      - name: Build pinned PDF dependencies
        run: ./bootstrap-pdf-tools.sh

      - name: Run packaging and restriction quality gate
        run: ./quality-gate.sh
